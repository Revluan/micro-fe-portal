name: Build and Push Docker Images

on:
  push:
    branches: [test03]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v3

      - name: 🧰 Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: 🔑 Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 📦 Build frontend image
        run: |
          docker build -f docker/Dockerfile.frontend -t ${{ secrets.DOCKER_USERNAME }}/micro-fe-frontend:latest .

      - name: 📦 Build service image
        run: |
          docker build -f docker/Dockerfile.service -t ${{ secrets.DOCKER_USERNAME }}/micro-fe-service:latest .

      - name: 📤 Push images to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/micro-fe-frontend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/micro-fe-service:latest
