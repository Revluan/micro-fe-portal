name: Manual Build and Push Docker Images

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - portal
          - dashboard
          - service

jobs:
  build-portal:
    if: ${{ github.event.inputs.target == 'portal' || github.event.inputs.target == 'all' }}
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v3

      - name: 📦 Setup PNPM
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: 📦 Install dependencies
        run: pnpm install

      - name: 🔧 Build portal
        run: pnpm --filter ./apps/portal... build

      - name: 🐳 Build portal Docker image
        run: docker build -f docker/Dockerfile.portal -t ${{ secrets.DOCKER_USERNAME }}/micro-fe-portal:latest .

      - name: 🔑 Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 📤 Push portal image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/micro-fe-portal:latest

  build-dashboard:
    if: ${{ github.event.inputs.target == 'dashboard' || github.event.inputs.target == 'all' }}
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v3

      - name: 📦 Setup PNPM
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: 📦 Install dependencies
        run: pnpm install

      - name: 🔧 Build dashboard
        run: pnpm --filter ./apps/dashboard... build

      - name: 🐳 Build dashboard Docker image
        run: docker build -f docker/Dockerfile.dashboard -t ${{ secrets.DOCKER_USERNAME }}/micro-fe-dashboard:latest .

      - name: 🔑 Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 📤 Push dashboard image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/micro-fe-dashboard:latest

  build-service:
    if: ${{ github.event.inputs.target == 'service' || github.event.inputs.target == 'all' }}
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v3

      - name: 📦 Setup PNPM
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: 📦 Install dependencies
        run: pnpm install

      - name: 🔧 Build service
        run: pnpm --filter ./services/config-service... build

      - name: 🐳 Build service Docker image
        run: docker build -f docker/Dockerfile.service -t ${{ secrets.DOCKER_USERNAME }}/micro-fe-service:latest .

      - name: 🔑 Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 📤 Push service image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/micro-fe-service:latest
