name: Build and Push Docker Images

on:
  push:
    branches: [test03]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v3

      # - name: 🧱 Set up Node and pnpm
      #   uses: actions/setup-node@v3
      #   with:
      #     node-version: 18
      #     cache: 'pnpm'
      
      - name: 📦 Enable corepack 
        run: corepack enable

      - name: 📦 Enable pnpm t
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: 📦 Install dependencies
        run: pnpm install --ignore-scripts=false

      - name: 🧪 Check pnpm version
        run: pnpm -v

      - name: 🔧 Build frontend
        run: |
          pnpm --filter ./apps/portal... build
          pnpm --filter ./apps/dashboard... build

      - name: 🔧 Build config-service
        run: pnpm --filter ./services/config-service... build

      - name: 🐳 Build frontend image
        run: docker build -f docker/Dockerfile.frontend -t ${{ secrets.DOCKER_USERNAME }}/micro-fe-frontend:latest .

      - name: 🐳 Build service image
        run: docker build -f docker/Dockerfile.service -t ${{ secrets.DOCKER_USERNAME }}/micro-fe-service:latest .

      - name: 🔑 Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 📤 Push images to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/micro-fe-frontend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/micro-fe-service:latest
